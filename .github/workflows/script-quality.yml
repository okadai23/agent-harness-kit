name: script-quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scripts:
    name: Check JS, JSON, and Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v8
      - name: Check JavaScript syntax
        run: node scripts/check-js-syntax.mjs
      - name: Check JSON syntax
        run: node scripts/check-json.mjs
      - name: Check Python syntax with uv
        run: uv run python scripts/check-python-syntax.py
      - name: Run harness fixture tests with uv
        run: uv run python scripts/harness/run_rule_tests.py
      - name: Check APM package shape
        run: node scripts/apm/check-local-package.mjs
      - name: Check Claude native layer
        run: node scripts/claude/check-native.mjs

